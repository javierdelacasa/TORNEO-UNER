<body>

 <aside>

 </aside>

<script>
/* ===== CONFIGURACIÓN =====
   Cada pestaña de la planilla se publica por separado: Archivo > Compartir > Publicar en la web > elegí la pestaña > .csv
   Si SHEET_PARTIDOS_URL queda vacío se muestran datos de ejemplo. */
const SHEET_PARTIDOS_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSUtPgMkU0zHyb56_fFzxt85FTm7QWAblprbt5JH2Xn7LL9T_sdefp5nvJIHRQLXf3Ty92ChIJ3QBb7/pub?gid=1678999885&single=true&output=csv";   // Torneo | Jornada | Fecha | Hora | Local | GolesLocal | GolesVisitante | Visitante | Estado | PenalesLocal | PenalesVisitante | DetalleLocal | DetalleVisitante | EscudoLocal | EscudoVisitante
const SHEET_EQUIPOS_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSUtPgMkU0zHyb56_fFzxt85FTm7QWAblprbt5JH2Xn7LL9T_sdefp5nvJIHRQLXf3Ty92ChIJ3QBb7/pub?gid=19745345&single=true&output=csv";    // Torneo | Equipo | Fundacion | Estadio | ClubDe | Escudo
const SHEET_JUGADORES_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSUtPgMkU0zHyb56_fFzxt85FTm7QWAblprbt5JH2Xn7LL9T_sdefp5nvJIHRQLXf3Ty92ChIJ3QBb7/pub?gid=740963866&single=true&output=csv";  // Equipo | Posicion (DIR/ARQ/DEF/MED/DEL) | Numero | Nombre | Rol | Nacimiento (DD/MM/AAAA) | Altura | Goles | Amarillas | Rojas
const SHEET_CAMPEONES_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSUtPgMkU0zHyb56_fFzxt85FTm7QWAblprbt5JH2Xn7LL9T_sdefp5nvJIHRQLXf3Ty92ChIJ3QBb7/pub?gid=1914518686&single=true&output=csv";  // Torneo | Edicion (ej. 2026 C) | Campeon
const NOMBRE="Liga UNER", TORNEO_A="Categoría A", TORNEO_B="Categoría B";
/* Acepta "Categoría A" o "Torneo UNER - Categoría A" en la planilla; en pantalla siempre se ve "Categoría A" / "Categoría B". */
const canon=t=>{const x=norm(t||"");return /categoriaa$/.test(x)?TORNEO_A:/categoriab$/.test(x)?TORNEO_B:(t||"")};
const ACTUALIZAR_CADA_SEGUNDOS=60;
const LOGO=""; /* nombre del archivo del logo dentro de la carpeta "escudos" (ej. "logo.png"). Si queda vacío se muestra el texto. */
const SHEET_HISTORIAL_URL="";  // opcional, partidos de años anteriores solo para "Enfrentamientos": Fecha | Competencia | Local | GolesLocal | GolesVisitante | Visitante
const FORMULARIO_URL="https://docs.google.com/forms/d/e/1FAIpQLSfdAv7Ho0LtLnYNJ_yOehp1_O7W2heoa0y0AM--SAzDqVavUg/viewform?embedded=true"; /* "Tu opinión cuenta": pegá acá el enlace para insertar de tu Google Form (o el código <iframe> completo). Si queda vacío, el botón no aparece. */
const ENFRENTAMIENTOS_DESDE="agosto 2026"; /* texto que aparece en el título de Enfrentamientos */
const DESEMPATE_DIRECTO=true; /* true: si hay empate de puntos, define el partido entre ellos y después la diferencia de gol. false: solo diferencia de gol. */
/* Jornadas de playoffs (columna Jornada): "Cuartos de final", "Semifinal", "Final", "Promoción". Cualquier otra es fase regular. */

/* Colores por posición: y=amarillo, c=celeste, o=naranja, r=rojo */
const ZONAS={[TORNEO_A]:{1:"y",2:"y",3:"c",4:"c",5:"c",6:"c",7:"o",8:"r"},[TORNEO_B]:{1:"y",2:"c",3:"c",4:"c",5:"c",6:"c",7:"c"}};
const LEYENDA={[TORNEO_A]:[["y","Semifinales (directo)"],["c","Cuartos de final"],["o","Promoción"],["r","Descenso"]],[TORNEO_B]:[["y","Semifinales"],["c","Cuartos de final"]]};

/* ===== DATOS DE EJEMPLO ===== */
const dd=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})};
const EQA=["Los Halcones","Deportivo Sur","Club Unión","Atlético Norte","Defensores","Juventud","Sportivo","Río Claro"];
const EQB=["Ingeniería FC","Barrio Alto","Real Paraná","Estudiantes UNER","Los Tigres","Central Oeste","San Martín","La Granja"];
function demoP(){
 const R=[],add=(t,j,o,h,l,a,b,v,e="")=>R.push([t,j,dd(o),h,l,a,b,v,e].join(","));
 [[TORNEO_A,EQA,0],[TORNEO_B,EQB,1]].forEach(([t,E,ti])=>{const a=[...E];
  for(let r=0;r<7;r++){for(let i=0;i<4;i++){const [h,v]=(r+i)%2?[a[i],a[7-i]]:[a[7-i],a[i]];
   add(t,"Fecha "+(r+1),-63+r*7+ti,i%2?"18:00":"16:00",h,(E.indexOf(h)*3+r)%4,(E.indexOf(v)*2+r+1)%3,v)}
   a.splice(1,0,a.pop())}});
 const H="Torneo,Jornada,Fecha,Hora,Local,GolesLocal,GolesVisitante,Visitante,Estado,Cruce";
 const tmp=leerP(H+"\n"+R.join("\n")),sA=n=>standing(TORNEO_A,tmp)[n-1].n,sB=n=>standing(TORNEO_B,tmp)[n-1].n,Q="Cuartos de final";
 add(TORNEO_A,Q,-5,"16:00",sA(4),2,1,sA(5));add(TORNEO_A,Q,-5,"18:00",sA(3),0,1,sA(6));
 add(TORNEO_A,"Semifinal",0,"18:00",sA(1),1,0,sA(4),"35'");add(TORNEO_A,"Semifinal",0,"20:00",sA(2),"","",sA(6));
 add(TORNEO_B,Q,-4,"16:00",sB(4),1,0,sB(5));add(TORNEO_B,Q,-4,"18:00",sB(2),3,1,sB(7));add(TORNEO_B,Q,-4,"20:00",sB(3),0,2,sB(6));
 add(TORNEO_B,"Semifinal",1,"16:00",sB(1),"","",sB(4));add(TORNEO_B,"Semifinal",1,"18:00",sB(2),"","",sB(6));
 R.push([TORNEO_A,"Final",dd(1),"20:00","","","","","","F"].join(","));
 return H+"\n"+R.join("\n");
}
function demoJ(){
 const N=["Lucas","Mateo","Tomás","Agustín","Nicolás","Franco","Joaquín","Bruno","Matías","Facundo","Ezequiel","Gonzalo"],Ap=["Pérez","Gómez","Ríos","Sosa","Acosta","Molina","Vega","Luna","Ortiz","Silva","Paz","Núñez"];
 const P=["DIR","ARQ","ARQ","DEF","DEF","DEF","DEF","MED","MED","MED","DEL","DEL"],o=["Equipo,Posicion,Numero,Nombre,Nacimiento,Altura,Goles,Amarillas,Rojas"];
 [...EQA,...EQB].forEach((q,t)=>P.forEach((p,i)=>{const k=t*12+i;
  o.push([q,p,p==="DIR"?"DT":i,N[(k*5)%12]+" "+Ap[(k*7+t)%12],k%37===3?dd(k%2).replace(/\d{4}$/,"1999"):`${1+k%28}/${1+k%12}/${1996+k%10}`,(1.7+(k%20)/100).toFixed(2),p==="DEL"?(k*3)%8:p==="MED"?k%4:p==="DEF"?k%2:0,(k*5)%6,k%9===0?1:0].join(","))}));
 return o.join("\n");

 return `<h2 class="tt">${esc(t)}</h2><div class="ttabs">`+T.map(([k,l])=>`<button data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("")+`</div>`+(S.tab==="fix"?tFix(t):S.tab==="eq"?tEq(t):tCamp(t));
}
function pEquipo(){
 const eq=S.eq,t=S.t,E=equipos.find(x=>x.equipo===eq)||{};
 const mine=partidos.filter(p=>p.l===eq||p.v===eq).sort((a,b)=>(a.f+a.h).localeCompare(b.f+b.h));
 const prox=mine.filter(p=>!jugado(p)).slice(0,5),res=mine.filter(p=>jugado(p)&&!envivo(p)).reverse(),rv=ver.has("res")?res:res.slice(0,5);
 const riv=p=>p.l===eq?p.v:p.l;
 const P=jug.filter(j=>j.equipo===eq),G={DIR:"DIR",DT:"DIR",ARQ:"ARQ",DEF:"DEF",MED:"MED",DEL:"DEL"};
 const top=k=>P.filter(j=>+j[k]>0).sort((a,b)=>b[k]-a[k]).map(j=>[j.nombre,j[k]]);
 const gk=j=>/^dt$/i.test((j.numero||"").trim())?"DIR":(G[(j.posicion||"").toUpperCase().slice(0,3)]||"OTROS");
 let pl="";["DIR","ARQ","DEF","MED","DEL","OTROS"].forEach(g=>{const L=P.filter(j=>gk(j)===g).sort((x,y)=>(+x.numero||999)-(+y.numero||999)||x.nombre.localeCompare(y.nombre));
  if(L.length)pl+=`<tr class="sec"><td>${g==="OTROS"?"JUGADORES":g}</td></tr>`+L.map(j=>`<tr><td class="l"><span class="cw"><span class="cr s nb${/^dt$/i.test((j.numero||"").trim())?" dt":""}">${esc(j.numero)||"•"}</span></span><b>${esc(j.nombre)}</b>${j.rol?`<small>${esc(j.rol)}</small>`:""}</td></tr>`).join("")});
 const tb=(ti,h,b)=>`<section class="box"><div class="bh">${ti}</div><div class="scroll"><table>${h?`<thead><tr>${h}</tr></thead>`:""}<tbody>${b||`<tr><td colspan="9">Sin datos</td></tr>`}</tbody></table></div></section>`;
 const kv=(a,b)=>b?`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`:"";
 return `<div class="crumb"><button data-t="${esc(t)}">${esc(t)}</button> › <b>${esc(eq)}</b></div><h2 class="tt">${K(eq)}${esc(eq)}</h2>
 <div class="grid2"><div>`+
 tb("Próximos partidos","<th>Día</th><th class='l'>vs Equipo</th><th>Hora</th>",prox.map(p=>`<tr${dm(p)}><td>${fdm(p.f)}</td><td class="l">${K(riv(p),"","s")}${esc(riv(p))}</td><td>${esc(aplaz(p)?p.e:p.h)}</td></tr>`).join(""))+
 tb("Resultados","<th>Día</th><th class='l'>vs Equipo</th><th>Res</th>",rv.map(p=>{const L=p.l===eq,a=L?p.gl:p.gv,b=L?p.gv:p.gl;return `<tr${dm(p)}><td>${fdm(p.f)}</td><td class="l">${K(riv(p),"","s")}${esc(riv(p))}</td><td class="${a>b?"gw":a<b?"gl":"gd"}">${a}-${b}</td></tr>`}).join("")).replace("</table></div></section>",`</table></div>${res.length>5?`<button class="vm" data-v="res">Ver ${ver.has("res")?"menos ⌃":"más ⌄"}</button>`:""}</section>`)+
 tb("Plantel","",pl)+
 `</div><div><section class="box">${kv("Fundación",E.fundacion)}${kv("Estadio",E.estadio)}${kv("Club de",E.clubde)}${!(E.fundacion||E.estadio||E.clubde)?'<div class="msg">Sin datos del club.</div>':""}</section>
 <section class="box nf"><div class="bh c">Estadísticas personales</div><div style="padding:0 10px 10px;display:grid;gap:10px">${caja("g"+eq,"Goles",top("goles"))}${caja("r"+eq,"Tarjetas rojas",top("rojas"))}${caja("a"+eq,"Tarjetas amarillas",top("amarillas"))}</div></section></div></div>`;
}

function pCal(){
 const hoy=hoyISO(),lun=sumar(hoy,-((new Date().getDay()+6)%7)+7*sem),N=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
 const col=(d,i)=>{const[y,m,x]=d.split("-").map(Number);let h="";
  const cu=jug.filter(j=>{const n=iso(j.nacimiento);return n&&+n.slice(5,7)===m&&+n.slice(8)===x}),an=equipos.filter(e=>{const n=iso(e.fundacion);return n&&+n.slice(5,7)===m&&+n.slice(8)===x});
  if(cu.length)h+=`<div class="gt y">Cumpleaños</div>`+cu.map(j=>`<div class="ci"><b>${esc(j.nombre)}</b>(${esc(j.equipo)})<small>cumple hoy ${y-(+iso(j.nacimiento).slice(0,4))} años</small></div>`).join("");
  if(an.length)h+=`<div class="gt a">Aniversario</div>`+an.map(e=>`<div class="ci"><b>${esc(e.equipo)}</b><small>cumple hoy ${y-(+iso(e.fundacion).slice(0,4))} años desde su fundación</small></div>`).join("");
  const L=partidos.filter(p=>p.f===d).sort((a,b)=>a.t.localeCompare(b.t)||a.h.localeCompare(b.h));
  [...new Set(L.map(p=>p.t))].forEach(t=>{h+=`<button class="gt" data-t="${esc(t)}">${esc(t)}</button>`+L.filter(p=>p.t===t).map(p=>`<div class="ci"${dm(p)}><b>${esc(p.h)}</b>${esc(NL(p))} ${jugado(p)?`${p.gl}-${p.gv}`:"VS"} ${esc(NV(p))}${aplaz(p)?`<small style="color:#b45309;font-weight:700">${esc(p.e)}</small>`:""}</div>`).join("")});
  return `<div class="cc"><div class="ch ${d===hoy?"hoy":""}"><small>${d===hoy?"Hoy":N[i]}</small><b>${fdm(d)}</b></div>${h}</div>`};
 return `<div class="head"><div class="dayrow"><button class="ar" id="cp" aria-label="Semana anterior" style="font-size:17px">‹ Atrás</button><span class="lab">Calendario</span><button class="ar" id="cn" aria-label="Semana siguiente" style="font-size:17px">Siguiente ›</button></div></div><div class="box scroll"><div class="cal7">`+[0,1,2,3,4,5,6].map(i=>col(sumar(lun,i),i)).join("")+`</div></div>`;
}
/* ===== TU OPINIÓN CUENTA (Google Forms embebido) ===== */
function pOpinion(){
 const m=FORMULARIO_URL.match(/src=["']([^"']+)["']/);let u=(m?m[1]:FORMULARIO_URL).trim().replace(/&amp;/g,"&");
 if(/docs\.google\.com\/forms/.test(u)&&!/embedded=true/.test(u))u+=(u.includes("?")?"&":"?")+"embedded=true";
 return `<h2 class="tt">Tu opinión cuenta</h2><div class="fw"><iframe src="${esc(u)}" title="Formulario" loading="lazy" allowtransparency="true" frameborder="0">Cargando…</iframe></div>`;
}
/* ===== PÁGINA DE PARTIDO ===== */
const aplaz=p=>!jugado(p)&&!!p.e;
const rj=n=>n>0?'<i class="rj"></i>'.repeat(Math.min(n,3)):"";
const mkey=p=>[p.t,p.j,p.l||"",p.v||"",p.f].join("|");
const dm=p=>p.l&&p.v?` data-m="${esc(mkey(p))}"`:"";
const fdl=i=>i?`${i.slice(8)}/${i.slice(5,7)}/${i.slice(0,4)}`:"";
const orden=p=>{const f=fase(p.j);return f?{c:101,s:102,p:103,f:104}[f]:(parseInt((p.j||"").replace(/\D+/g,""))||0)};
function jugados(eq,exc){
 const H=hist.filter(h=>h.l===eq||h.v===eq).sort((a,b)=>a.f.localeCompare(b.f)).map(h=>({f:h.f,c:h.c,l:h.l,v:h.v,gl:h.gl,gv:h.gv}));
 const C=partidos.filter(p=>p!==exc&&(p.l===eq||p.v===eq)&&jugado(p)&&!envivo(p)).sort((a,b)=>orden(a)-orden(b)||(a.f||"").localeCompare(b.f||"")||(a.h||"").localeCompare(b.h||"")).map(p=>({f:p.f,c:`${p.t}, ${p.j}`,l:p.l,v:p.v,gl:p.gl,gv:p.gv}));
 return[...H,...C];
}
function pMatch(){
 const p=partidos.find(x=>mkey(x)===S.m);
 if(!p)return`<div class="msg">No se encontró el partido.</div>`;
 const A=p.l,B=p.v,ok=jugado(p),lv=envivo(p),pen=ok&&p.pl!=null&&p.pv!=null&&!isNaN(p.pl)&&!isNaN(p.pv);
 const eqb=n=>`<button class="mt" data-eq="${esc(n)}">${K(n)}<span>${esc(n)}</span></button>`;
 const centro=ok?`<small>${esc(p.h)}${p.h&&p.f?" · ":""}${fdl(p.f)}</small><b>${rj(p.rl)}${p.gl} - ${p.gv}${rj(p.rv)}</b>${pen?`<small>Penales ${p.pl}-${p.pv}</small>`:""}<small class="${lv?"live":""}">${esc(p.e||"Final")}</small>`
  :`<small>${esc(p.h)}</small><b>${p.f?fdm(p.f):"-"}</b><small class="${aplaz(p)?"ap":""}">${aplaz(p)?esc(p.e):"Prog."}</small>`;
 const forma=n=>{const L=jugados(n).slice(-5);return L.length?L.map(m=>{const a=m.l===n?m.gl:m.gv,b=m.l===n?m.gv:m.gl,c=a>b?"v":a<b?"d":"e";return`<span class="fm ${c}" title="${esc(m.l)} ${m.gl}-${m.gv} ${esc(m.v)}">${c.toUpperCase()}</span>`}).join(""):'<span style="color:var(--mute)">Sin partidos</span>'};
 const H=jugados(A,p).filter(m=>m.l===B||m.v===B).reverse();
 let wa=0,wb=0,em=0;H.forEach(m=>{const a=m.l===A?m.gl:m.gv,b=m.l===A?m.gv:m.gl;a>b?wa++:a<b?wb++:em++});
 const abre=ver.has("h2h"),filasH=(abre?H.slice(0,10):[]).map((m,i)=>{const g=m.gl>m.gv?1:m.gl<m.gv?2:0;
  return`<div class="hr${i%2?" al":""}"><div class="a ${g===1?"w":"dim"}">${esc(m.l)}</div><div><b>${esc(m.c)}</b><div class="sc2">${m.gl} — ${m.gv}</div><small>${fdl(m.f)}</small></div><div class="b ${g===2?"w":"dim"}">${esc(m.v)}</div></div>`}).join("");
 const tri=n=>`<i>${n}</i> ${n===1?"Triunfo":"Triunfos"}`;
 return `<div class="crumb"><button data-t="${esc(p.t)}">${esc(p.t)}</button>, ${esc(p.j)} › <b>${esc(A)} vs. ${esc(B)}</b></div>
 <div class="mh">${eqb(A)}<div class="mc">${centro}</div>${eqb(B)}</div>
 <section class="box"><div class="bh">Últimos partidos</div><div class="ul"><div>${eqb(A)}${forma(A)}</div><div>${eqb(B)}${forma(B)}</div></div></section>
 <section class="box"><div class="bh">Enfrentamientos <small style="color:var(--mute);font-weight:400;text-transform:none">· desde ${esc(ENFRENTAMIENTOS_DESDE)}</small></div>
 <div class="hs"><div>${K(A)}<span>${tri(wa)}</span></div><div><span class="ee">E</span><span><i>${em}</i> ${em===1?"Empate":"Empates"}</span></div><div>${K(B)}<span>${tri(wb)}</span></div></div>
 ${filasH}${H.length?`<button class="more" data-v="h2h">${abre?"Ver menos ⌃":"Ver más ⌄"}</button>`:`<div class="msg" style="padding:14px;border-top:1px solid var(--line)">Todavía no hay enfrentamientos previos.</div>`}</section>
 ${p.ar?`<section class="box"><div class="kv" style="border-top:0"><span>Árbitro</span><b>${esc(p.ar)}</b></div></section>`:""}`;
}

function pintar(){
 $("#menu").innerHTML=abierto?torneos().map(t=>`<button class="it" data-t="${esc(t)}" aria-current="${S.t===t&&S.k!=="inicio"}">${esc(t)}</button>`).join(""):"";
 $("#chev").textContent=abierto?"⌃":"⌄";
 {const html=S.k==="inicio"?inicio():S.k==="cal"?pCal():S.k==="op"?pOpinion():S.k==="m"?pMatch():S.k==="t"?pTorneo():pEquipo();$("#app").innerHTML=["t","e","m"].includes(S.k)?html.replace(/<section class="box">([\s\S]*?)<\/section>/g,'<section class="box fr"><div class="in">$1</div></section>'):html}
 const all=s=>document.querySelectorAll(s);
 all("[data-t]").forEach(b=>b.onclick=()=>{S={k:"t",t:b.dataset.t,tab:"fix"};pintar();scrollTo(0,0)});
 all("[data-eq]").forEach(b=>b.onclick=()=>{const q=b.dataset.eq;S={k:"e",t:(partidos.find(p=>p.l===q||p.v===q)||{}).t||S.t,eq:q};pintar();scrollTo(0,0)});
 all("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;pintar()});
 all("[data-v]").forEach(b=>b.onclick=()=>{const k=b.dataset.v;ver.has(k)?ver.delete(k):ver.add(k);pintar()});
 all("[data-m]").forEach(b=>b.onclick=e=>{if(e.target.closest("[data-eq],[data-t]"))return;const p=partidos.find(x=>mkey(x)===b.dataset.m);S={k:"m",m:b.dataset.m,t:p?p.t:S.t};pintar();scrollTo(0,0)});
 all("[data-f]").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;pintar()});
 if($("#prev")){$("#prev").onclick=()=>{dia=sumar(dia,-1);pintar()};$("#next").onclick=()=>{dia=sumar(dia,1);pintar()}}
 if($("#cp")){$("#cp").onclick=()=>{sem--;pintar()};$("#cn").onclick=()=>{sem++;pintar()}}
 const js=()=>[...new Set(partidos.filter(p=>p.t===S.t).map(p=>p.j))];
 if($("#jp")){$("#jp").onclick=()=>{const l=js();jor[S.t]=l[l.indexOf(jor[S.t])-1];pintar()};$("#jn").onclick=()=>{const l=js();jor[S.t]=l[l.indexOf(jor[S.t])+1];pintar()}}
}
if(FORMULARIO_URL.trim())$("#op").style.display="";
$("#op").onclick=()=>{S={k:"op"};pintar();scrollTo(0,0)};
$("#cal").onclick=()=>{S={k:"cal"};sem=0;pintar();scrollTo(0,0)};
$("#gd").onclick=()=>{abierto=!abierto;pintar()};
$("#logo").onclick=()=>{S={k:"inicio"};dia=hoyISO();pintar()};

const bajar=async(u,demo,req)=>{if(!SHEET_PARTIDOS_URL)return demo();if(!u)return"";try{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return await r.text()}catch(e){if(req)throw e;console.warn("No se pudo leer una pestaña opcional:",u,e);return""}};
async function cargar(){
 let a,b,c,d,h;
 try{[a,b,c,d,h]=await Promise.all([bajar(SHEET_PARTIDOS_URL,demoP,1),bajar(SHEET_EQUIPOS_URL,demoE),bajar(SHEET_JUGADORES_URL,demoJ),bajar(SHEET_CAMPEONES_URL,demoC),bajar(SHEET_HISTORIAL_URL,()=>"")])}
 catch(e){console.error(e);if(primera)$("#app").innerHTML=`<div class="msg">No se pudo descargar la planilla.<br><small>${esc(e.message||e)}</small><br><small>Revisá que las pestañas estén publicadas en la web como CSV y que la página esté abierta desde un hosting (no desde una vista previa).</small></div>`;primera=false;return}
 try{
  partidos=leerP(a);equipos=rows(b).map(e=>({...e,torneo:canon(e.torneo)}));jug=rows(c);camp=rows(d).map(e=>({...e,torneo:canon(e.torneo)}));ESC={};
  hist=rows(h||"").map(o=>({f:iso(o.fecha),c:o.competencia||"",l:o.local,v:o.visitante,gl:num(o.goleslocal),gv:num(o.golesvisitante)})).filter(x=>x.l&&x.v&&x.gl!=null&&x.gv!=null&&!isNaN(x.gl)&&!isNaN(x.gv));
  partidos.forEach(p=>{if(p.el)ESC[p.l]=p.el;if(p.ev)ESC[p.v]=p.ev});equipos.forEach(e=>{if(e.escudo)ESC[e.equipo]=e.escudo});
  try{bracket(TORNEO_A);bracket(TORNEO_B);promo()}catch(e){console.warn(e)}
  $("#foot").textContent=(SHEET_PARTIDOS_URL?"":"Datos de ejemplo. ")+"Actualizado a las "+new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  pintar();
 }catch(e){console.error(e);if(primera)$("#app").innerHTML=`<div class="msg">Error al mostrar los datos.<br><small>${esc(e.message||e)}</small></div>`}
 primera=false;
}
document.title=NOMBRE;$("#logo").innerHTML=LOGO?`<img src="${esc(imgSrc(LOGO)||LOGO)}" alt="${esc(NOMBRE)}" onerror="this.replaceWith('${esc(NOMBRE)}')">`:esc(NOMBRE);
cargar();setInterval(cargar,ACTUALIZAR_CADA_SEGUNDOS*1000);
</script>
</body>
